name: Backend tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [integrate-smc-research-indicators]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-smc-research.txt
      - name: Install backend and offline research test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-smc-research.txt
      - name: Run backend unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

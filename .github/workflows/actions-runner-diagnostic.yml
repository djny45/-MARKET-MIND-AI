name: Actions runner diagnostic

on:
  push:
    branches: ['diag/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-smoke:
    name: Runner startup smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove a runner can start without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_smoke_started=true"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          uname -a
          python3 --version

  actionlint:
    name: Validate workflow syntax with actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and run actionlint
        shell: bash
        run: |
          set -euo pipefail
          go version
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$HOME/go/bin/actionlint" .github/workflows/*.yml

  zizmor:
    name: Audit workflow security with zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor offline
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          online-audits: false
          advanced-security: false
          annotations: true
          color: false

services:
  backend:
    build:
      context: ./backend
    environment:
      MARKET_MIND_DB: /data/market_mind.db
      MARKET_MIND_AUTH_DB: /data/auth_sessions.sqlite3
      MARKET_MIND_AUTH_REQUIRED: "true"
      MARKET_MIND_OWNER_PASSWORD_HASH: ${MARKET_MIND_OWNER_PASSWORD_HASH:-}
      MARKET_MIND_COOKIE_SECURE: "false"
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:8080}
      N8N_REVIEWER_TOKENS_JSON: ${N8N_REVIEWER_TOKENS_JSON:-}
      N8N_BASE_URL: ${N8N_BASE_URL:-}
      N8N_API_KEY: ${N8N_API_KEY:-}
    volumes:
      - market_mind_data:/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  agent-supervisor:
    build:
      context: ./backend
    command: ["python", "-m", "app.analytical_agent_tasks"]
    environment:
      MARKET_MIND_DB: /data/market_mind.db
      AGENT_SUPERVISOR_POLL_SECONDS: "2"
      AGENT_SUPERVISOR_BATCH_SIZE: "50"
      AGENT_SUPERVISOR_MAX_CONCURRENCY: "4"
    volumes:
      - market_mind_data:/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import datetime as dt,os,sqlite3; db=sqlite3.connect('/data/market_mind.db',timeout=5); row=db.execute('SELECT state,heartbeat_at,process_id FROM analytical_agent_supervisor_heartbeat WHERE singleton_id=1').fetchone(); db.close(); assert row is not None and row[0]=='running'; age=(dt.datetime.now(dt.timezone.utc)-dt.datetime.fromisoformat(row[1])).total_seconds(); assert -5 <= age <= 90; os.kill(row[2],0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL


  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.7
    profiles: ["n8n"]
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  market_mind_data:
  n8n_data:

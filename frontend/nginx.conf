server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Concurrent connections per client IP (zone declared in 00-ingress-limits.conf).
    limit_conn market_mind_conn 20;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Keep API traffic on the same browser origin; backend is not host-published.
    location /api/ {
        limit_req zone=market_mind_api burst=20 nodelay;

        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }

    location / {
        limit_req zone=market_mind_static burst=40 nodelay;
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
}

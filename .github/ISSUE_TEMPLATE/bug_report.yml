name: Bug report
description: Something is broken, wrong, or claims something it should not
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. Please do not include
        secrets, API tokens or private market data. Security problems belong in
        a private advisory, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        I ran `docker compose up --build` and opened /api/ready ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend API
        - Research workers / workflows
        - Frontend terminal
        - Data provenance / licensing
        - Backup / recovery / DR
        - Security / auth / rate limiting
        - CI / build / tooling
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Output of `git rev-parse --short HEAD`, or the image tag.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste error output. Remove paths, tokens and personal data first.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I am not reporting a security vulnerability (those go to SECURITY.md)
          required: true
        - label: I removed secrets, tokens and personal data from this report
          required: true

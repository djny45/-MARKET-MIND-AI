name: Quality checks (Version 3.4)

on:
  push:
    branches: [main, 'feat/**', 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Compile backend app
        run: python -m compileall -q backend/app

      - name: Run backend unit tests (require at least one test)
        env:
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          import unittest

          suite = unittest.defaultTestLoader.discover("backend/tests")
          count = suite.countTestCases()
          if count == 0:
              raise SystemExit("CI failure: no backend unit tests were discovered")

          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          print(f"Backend unit tests passed: {count} tests discovered")
          PY

      - name: API runtime smoke test
        env:
          PYTHONPATH: backend
          MARKET_MIND_DB: ${{ runner.temp }}/smoke.sqlite
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import socket
          import tempfile
          import threading
          import time
          import urllib.request

          import uvicorn

          with tempfile.TemporaryDirectory() as directory:
              # Uvicorn runs in this process, so configure its environment directly
              # before the application module is imported.
              os.environ["PYTHONPATH"] = "backend"
              os.environ["MARKET_MIND_DB"] = os.path.join(directory, "smoke.sqlite")

              # Keep the socket bound while Uvicorn starts to avoid a free-port race.
              sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              sock.bind(("127.0.0.1", 0))
              sock.listen(128)
              port = sock.getsockname()[1]

              config = uvicorn.Config("app.main:app", host="127.0.0.1", port=port, log_level="error")
              server = uvicorn.Server(config)
              server_thread = threading.Thread(
                  target=server.run,
                  kwargs={"sockets": [sock]},
                  daemon=True,
              )
              server_thread.start()

              base = f"http://127.0.0.1:{port}"
              ready = None

              try:
                  for _ in range(40):
                      if not server_thread.is_alive():
                          raise RuntimeError("API server exited before becoming ready")
                      try:
                          with urllib.request.urlopen(base + "/api/ready", timeout=2) as response:
                              ready = json.load(response)
                          break
                      except Exception:
                          time.sleep(0.25)
                  else:
                      raise RuntimeError("API server did not become ready")

                  assert ready["status"] == "ready"

                  with urllib.request.urlopen(base + "/api/health", timeout=3) as response:
                      health = json.load(response)
                  assert health["mode"] == "research-only"
                  assert health["paper_trading"] is False
                  assert health["broker_execution"] is False

                  with urllib.request.urlopen(base + "/api/providers/status", timeout=3) as response:
                      providers = json.load(response)
                  assert providers["status"] == "no_live_provider_configured"

                  with urllib.request.urlopen(base + "/api/market-data/sample?symbol=BTCUSD&interval=1d&limit=3", timeout=3) as response:
                      sample = json.load(response)
                  assert sample["status"] == "synthetic"
                  assert len(sample["bars"]) == 3

                  print("API runtime smoke test passed: readiness, health, provider status, synthetic fixture")
              finally:
                  server.should_exit = True
                  server_thread.join(timeout=5)
                  if server_thread.is_alive():
                      server.force_exit = True
                      server_thread.join(timeout=5)
                  sock.close()
          PY

      - name: Workflow node smoke test
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from app.workflow import execute_workflow

          nodes = [
              {"id": "input", "type": "market_input", "data": {"values": [100, 101, 103, 102]}},
              {"id": "quality", "type": "data_quality", "data": {}},
              {"id": "returns", "type": "returns", "data": {}},
          ]
          edges = [
              {"source": "input", "target": "quality"},
              {"source": "quality", "target": "returns"},
          ]
          result = execute_workflow(nodes, edges, {})
          assert result["status"] == "completed"
          assert result["results"]["quality"]["quality"]["status"] == "pass"
          print("Workflow node smoke test passed")
          PY

      - name: Capture backend failure diagnostics
        if: failure()
        env:
          PYTHONPATH: backend
        run: |
          python -m pip freeze > backend-pip-freeze.txt 2>&1 || true
          python -m unittest discover -s backend/tests -v > backend-test-retry.log 2>&1 || true

      - name: Upload backend diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            backend-pip-freeze.txt
            backend-test-retry.log
          if-no-files-found: warn

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Capture frontend failure diagnostics
        if: failure()
        working-directory: frontend
        run: |
          npm ls --all > frontend-dependency-tree.txt 2>&1 || true
          npm audit --json > frontend-npm-audit.json 2>&1 || true

      - name: Upload frontend diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-diagnostics
          path: |
            frontend/frontend-dependency-tree.txt
            frontend/frontend-npm-audit.json
          if-no-files-found: warn

  container-build:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.production.yml config --quiet

      - name: Build and start production stack
        run: docker compose -f docker-compose.production.yml up --build -d

      - name: Smoke-test frontend proxy and API health
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          base = "http://127.0.0.1:8080"
          deadline = time.monotonic() + 90
          last_error = None

          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(base + "/healthz", timeout=3) as response:
                      assert response.status == 200

                  with urllib.request.urlopen(base + "/", timeout=3) as response:
                      page = response.read().decode("utf-8")
                  assert "root" in page

                  with urllib.request.urlopen(base + "/api/health", timeout=3) as response:
                      health = json.load(response)
                  assert health["mode"] == "research-only"
                  assert health["broker_execution"] is False

                  with urllib.request.urlopen(base + "/api/providers/status", timeout=3) as response:
                      providers = json.load(response)
                  assert providers["status"] == "no_live_provider_configured"

                  print("Private deployment smoke test passed: Nginx, API reverse proxy, health, provider guardrails")
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(2)
          else:
              raise RuntimeError(f"Production stack did not pass smoke checks: {last_error}")
          PY

      - name: Verify container isolation and browser security headers
        run: |
          python - <<'PY'
          import json
          import subprocess
          import urllib.request

          config = json.loads(subprocess.check_output([
              "docker", "compose", "-f", "docker-compose.production.yml", "config", "--format", "json"
          ], text=True))
          services = config["services"]

          assert not services["api"].get("ports"), "API must not publish a host port"

          web_ports = services["web"].get("ports", [])
          assert len(web_ports) == 1, f"Expected exactly one web port binding, got {web_ports}"
          binding = web_ports[0]
          assert binding.get("host_ip") == "127.0.0.1", f"Web must bind loopback only: {binding}"
          assert str(binding.get("published")) == "8080"

          assert "ALL" in services["api"].get("cap_drop", [])
          assert "ALL" in services["web"].get("cap_drop", [])

          assert "no-new-privileges:true" in services["api"].get("security_opt", [])
          assert "no-new-privileges:true" in services["web"].get("security_opt", [])

          uid = subprocess.check_output([
              "docker", "compose", "-f", "docker-compose.production.yml", "exec", "-T", "web", "id", "-u"
          ], text=True).strip()
          assert uid.isdigit() and int(uid) != 0, f"Nginx must run as non-root, got UID {uid}"

          with urllib.request.urlopen("http://127.0.0.1:8080/") as response:
              headers = {key.lower(): value for key, value in response.headers.items()}

          for header in ("x-content-type-options", "x-frame-options", "referrer-policy", "permissions-policy"):
              assert header in headers, f"Missing browser security header: {header}"

          assert headers["x-frame-options"].upper() == "DENY"
          print("Isolation checks passed: API unpublished, web loopback-only, capabilities dropped, Nginx non-root, security headers present")
          PY

      - name: Verify backup and restore inside production API image
        run: |
          docker compose -f docker-compose.production.yml exec -T api python - <<'PY'
          import sqlite3
          import tempfile
          from pathlib import Path

          from backup_database import create_backup
          from restore_database import restore_backup

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              source = root / "source.db"
              backup = root / "backup.db"
              restored = root / "restored.db"

              with sqlite3.connect(source) as connection:
                  connection.execute("CREATE TABLE market_bars (symbol TEXT)")
                  connection.execute("INSERT INTO market_bars VALUES ('FIXTURE')")

              backed_up = create_backup(source, backup)
              assert backed_up["status"] == "verified"

              recovered = restore_backup(backup, restored)
              assert recovered["status"] == "restored_and_verified"

              with sqlite3.connect(restored) as connection:
                  assert connection.execute("SELECT symbol FROM market_bars").fetchone()[0] == "FIXTURE"

          print("Container backup/restore round-trip passed")
          PY

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.production.yml logs --no-color

      - name: Stop production stack
        if: always()
        run: docker compose -f docker-compose.production.yml down

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Audit backend Python dependencies
        run: pip-audit -r backend/requirements.txt --progress-spinner off

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          npm install --ignore-scripts
          npm audit --audit-level=high

      - name: Capture dependency audit diagnostics
        if: failure()
        run: |
          pip-audit -r backend/requirements.txt --progress-spinner off --format json > backend-pip-audit.json 2>&1 || true
          cd frontend
          npm audit --json > frontend-npm-audit.json 2>&1 || true

      - name: Upload dependency audit diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-diagnostics
          path: |
            backend-pip-audit.json
            frontend/frontend-npm-audit.json
          if-no-files-found: warn
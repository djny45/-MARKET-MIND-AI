name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app
      - run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
      - name: API runtime smoke test
        run: |
          python - <<'PY'
          import json
          import os
          import socket
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.request

          with tempfile.TemporaryDirectory() as directory:
              with socket.socket() as probe:
                  probe.bind(("127.0.0.1", 0))
                  port = probe.getsockname()[1]
              env = os.environ.copy()
              env["PYTHONPATH"] = "backend"
              env["MARKET_MIND_DB"] = os.path.join(directory, "smoke.sqlite")
              process = subprocess.Popen(
                  [sys.executable, "-m", "uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", str(port)],
                  cwd="backend", env=env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              )
              base = f"http://127.0.0.1:{port}"
              try:
                  for attempt in range(40):
                      if process.poll() is not None:
                          raise RuntimeError("API server exited before becoming ready")
                      try:
                          with urllib.request.urlopen(base + "/api/ready", timeout=2) as response:
                              ready = json.load(response)
                          break
                      except Exception:
                          time.sleep(0.25)
                  else:
                      raise RuntimeError("API server did not become ready")
                  assert ready["status"] == "ready"
                  with urllib.request.urlopen(base + "/api/health", timeout=3) as response:
                      health = json.load(response)
                  assert health["mode"] == "research-only"
                  assert health["paper_trading"] is False
                  assert health["broker_execution"] is False
                  with urllib.request.urlopen(base + "/api/providers/status", timeout=3) as response:
                      providers = json.load(response)
                  assert providers["status"] == "no_live_provider_configured"
                  with urllib.request.urlopen(base + "/api/market-data/sample?symbol=BTCUSD&interval=1d&limit=3", timeout=3) as response:
                      sample = json.load(response)
                  assert sample["status"] == "synthetic"
                  assert len(sample["bars"]) == 3
                  print("API runtime smoke test passed: readiness, health, provider status, synthetic fixture")
              finally:
                  process.terminate()
                  try:
                      process.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait(timeout=5)
          PY
      - run: |
          cd backend
          python - <<'PY'
          from app.workflow import execute_workflow
          nodes = [
              {"id": "input", "type": "market_input", "data": {"values": [100, 101, 103, 102]}},
              {"id": "quality", "type": "data_quality", "data": {}},
              {"id": "returns", "type": "returns", "data": {}},
          ]
          result = execute_workflow(nodes, [
              {"source": "input", "target": "quality"},
              {"source": "quality", "target": "returns"},
          ], {})
          assert result["status"] == "completed"
          assert result["results"]["quality"]["quality"]["status"] == "pass"
          PY
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd frontend && npm install && npm run build

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.production.yml config --quiet
      - name: Build and start private production stack
        run: docker compose -f docker-compose.production.yml up --build -d
      - name: Smoke-test frontend proxy and API health
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          base = "http://127.0.0.1:8080"
          deadline = time.monotonic() + 90
          last_error = None
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(base + "/healthz", timeout=3) as response:
                      assert response.status == 200
                  with urllib.request.urlopen(base + "/", timeout=3) as response:
                      page = response.read().decode("utf-8")
                  assert "root" in page
                  with urllib.request.urlopen(base + "/api/health", timeout=3) as response:
                      health = json.load(response)
                  assert health["mode"] == "research-only"
                  assert health["broker_execution"] is False
                  with urllib.request.urlopen(base + "/api/providers/status", timeout=3) as response:
                      providers = json.load(response)
                  assert providers["status"] == "no_live_provider_configured"
                  print("Private deployment smoke test passed: Nginx, API reverse proxy, health, provider guardrails")
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(2)
          else:
              raise RuntimeError(f"Production stack did not pass smoke checks: {last_error}")
          PY
      - name: Verify container isolation and browser security headers
        run: |
          python - <<'PY'
          import json
          import subprocess

          config = json.loads(subprocess.check_output([
              "docker", "compose", "-f", "docker-compose.production.yml", "config", "--format", "json"
          ], text=True))
          services = config["services"]
          assert not services["api"].get("ports"), "API must not publish a host port"
          web_ports = services["web"].get("ports", [])
          assert len(web_ports) == 1, f"Expected exactly one web port binding, got {web_ports}"
          binding = web_ports[0]
          assert binding.get("host_ip") == "127.0.0.1", f"Web must bind loopback only: {binding}"
          assert str(binding.get("published")) == "8080"
          assert "ALL" in services["api"].get("cap_drop", [])
          assert "ALL" in services["web"].get("cap_drop", [])
          assert "no-new-privileges:true" in services["api"].get("security_opt", [])
          assert "no-new-privileges:true" in services["web"].get("security_opt", [])

          uid = subprocess.check_output([
              "docker", "compose", "-f", "docker-compose.production.yml", "exec", "-T", "web", "id", "-u"
          ], text=True).strip()
          assert uid.isdigit() and int(uid) != 0, f"Nginx must run as non-root, got UID {uid}"

          with __import__("urllib.request").request.urlopen("http://127.0.0.1:8080/") as response:
              headers = {key.lower(): value for key, value in response.headers.items()}
          for header in ("x-content-type-options", "x-frame-options", "referrer-policy", "permissions-policy"):
              assert header in headers, f"Missing browser security header: {header}"
          assert headers["x-frame-options"].upper() == "DENY"
          print("Isolation checks passed: API unpublished, web loopback-only, capabilities dropped, Nginx non-root, security headers present")
          PY
      - name: Verify backup and restore inside production API image
        run: |
          docker compose -f docker-compose.production.yml exec -T api python - <<'PY'
          import sqlite3
          import tempfile
          from pathlib import Path
          from backup_database import create_backup
          from restore_database import restore_backup

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              source = root / "source.db"
              backup = root / "backup.db"
              restored = root / "restored.db"
              with sqlite3.connect(source) as connection:
                  connection.execute("CREATE TABLE market_bars (symbol TEXT)")
                  connection.execute("INSERT INTO market_bars VALUES ('FIXTURE')")
              backed_up = create_backup(source, backup)
              assert backed_up["status"] == "verified"
              recovered = restore_backup(backup, restored)
              assert recovered["status"] == "restored_and_verified"
              with sqlite3.connect(restored) as connection:
                  assert connection.execute("SELECT symbol FROM market_bars").fetchone()[0] == "FIXTURE"
          print("Container backup/restore round-trip passed")
          PY
      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.production.yml logs --no-color
      - name: Stop production stack
        if: always()
        run: docker compose -f docker-compose.production.yml down -v

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd frontend && npm install --package-lock-only --ignore-scripts
      - run: cd frontend && npm audit --audit-level=high

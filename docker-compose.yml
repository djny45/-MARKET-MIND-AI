services:
  backend:
    build:
      context: ./backend
    environment:
      MARKET_MIND_DB: /data/market_mind.db
      MARKET_MIND_AUTH_DB: /data/auth_sessions.sqlite3
      MARKET_MIND_AUTH_REQUIRED: "true"
      MARKET_MIND_OWNER_PASSWORD_HASH: ${MARKET_MIND_OWNER_PASSWORD_HASH:-}
      MARKET_MIND_COOKIE_SECURE: "false"
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    volumes:
      - market_mind_data:/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  market_mind_data:

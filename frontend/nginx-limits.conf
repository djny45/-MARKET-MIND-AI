# Ingress perimeter limits (http context).
#
# Copied to /etc/nginx/conf.d/00-ingress-limits.conf so it is included before
# default.conf and the zones below are visible to that server block.
# Values follow docs/PUBLIC-EXPOSURE-HARDENING.md section 4:
#   /api/          30 requests/minute per client IP
#   static routes 120 requests/minute per client IP
# The application keeps its own limiter; this is defence in depth, not a
# replacement.

limit_req_zone $binary_remote_addr zone=market_mind_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=market_mind_static:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=market_mind_conn:10m;

# Reject excess traffic with 429 (Too Many Requests), not 503.
limit_req_status 429;
limit_conn_status 429;

# Do not advertise the nginx version.
server_tokens off;

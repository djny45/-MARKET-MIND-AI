name: Deploy frontend to GitHub Pages (Vercel-free)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "HTTPS API base URL (only use a secured backend; see deployment guide)"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate API URL input
        shell: bash
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          python3 - "$API_URL" <<'PY'
          import sys
          from urllib.parse import urlsplit
          value = (sys.argv[1] if len(sys.argv) > 1 else "").strip()
          parsed = urlsplit(value)
          if parsed.scheme != "https" or not parsed.netloc:
              raise SystemExit("api_url must be an absolute HTTPS URL")
          if parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit("api_url must not contain credentials, query or fragment")
          print("api_url validation: ok")
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ inputs.api_url }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

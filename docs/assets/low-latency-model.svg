<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#0b121b"/><stop offset="1" stop-color="#162337"/></linearGradient></defs><rect width="1400" height="520" rx="24" fill="url(#b)"/><text x="55" y="65" fill="#f5f7fa" font-family="Arial" font-size="26" font-weight="700">LOW-LATENCY ENGINEERING MODEL</text><text x="55" y="95" fill="#91a3b6" font-family="Arial" font-size="14">Optimize each stage; measure real hardware and network performance. No end-to-end microsecond guarantee.</text><g font-family="Arial" text-anchor="middle"><g fill="#183744" stroke="#5b9ec4"><rect x="60" y="180" width="220" height="110" rx="12"/><text x="170" y="220" fill="#eff8ff" font-size="18" font-weight="700">ASYNC I/O</text><text x="170" y="250" fill="#b7ccdb" font-size="13">Persistent connections</text></g><g fill="#3e321e" stroke="#d4a14b"><rect x="390" y="180" width="220" height="110" rx="12"/><text x="500" y="220" fill="#fff8e9" font-size="18" font-weight="700">BOUNDED QUEUES</text><text x="500" y="250" fill="#e1d0ac" font-size="13">Backpressure · Drop metrics</text></g><g fill="#242348" stroke="#9185d3"><rect x="720" y="180" width="220" height="110" rx="12"/><text x="830" y="220" fill="#f8f5ff" font-size="18" font-weight="700">BATCH & VECTORIZE</text><text x="830" y="250" fill="#c9c4e2" font-size="13">Typed hot-path computation</text></g><g fill="#1c3b31" stroke="#56b595"><rect x="1050" y="180" width="280" height="110" rx="12"/><text x="1190" y="220" fill="#f0fff8" font-size="18" font-weight="700">PROFILE EVERY STAGE</text><text x="1190" y="250" fill="#b5d9c9" font-size="13">p50 · p95 · p99 · max</text></g></g><g stroke="#d5a24c" stroke-width="4" fill="none"><path d="M280 235H380m-12-10 12 10-12 10M610 235H710m-12-10 12 10-12 10M940 235H1040m-12-10 12 10-12 10"/></g><rect x="60" y="360" width="1270" height="85" rx="12" fill="#111b29" stroke="#33475d"/><text x="88" y="395" fill="#e6b760" font-family="Arial" font-size="15" font-weight="700">REALITY CHECK</text><text x="88" y="423" fill="#b5c3d2" font-family="Arial" font-size="14">Microsecond in-memory operations may be possible; market-feed network latency and browser delivery are not microsecond-guaranteed.</text></svg>
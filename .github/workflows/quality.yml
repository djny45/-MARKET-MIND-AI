name: Quality checks (Version 3.4)

on:
  push:
    branches: [main, 'feat/**', 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Compile backend app
        run: python -m compileall -q backend/app

      - name: Run backend unit tests (require at least one test)
        env:
          PYTHONPATH: backend
          MARKET_MIND_AUTH_REQUIRED: "false"
        run: |
          python - <<'PY'
          import unittest

          suite = unittest.defaultTestLoader.discover("backend/tests")
          count = suite.countTestCases()
          if count == 0:
              raise SystemExit("CI failure: no backend unit tests were discovered")

          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          print(f"Backend unit tests passed: {count} tests discovered")
          PY

      - name: API runtime smoke test
        env:
          PYTHONPATH: backend
          MARKET_MIND_AUTH_REQUIRED: "false"
          MARKET_MIND_DB: ${{ runner.temp }}/smoke.sqlite
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import socket
          import tempfile
          import threading
          import time
          import urllib.request

          import uvicorn

          with tempfile.TemporaryDirectory() as directory:
              # Uvicorn runs in this process, so configure its environment directly
              # before the application module is imported.
              os.environ["PYTHONPATH"] = "backend"
              os.environ["MARKET_MIND_DB"] = os.path.join(directory, "smoke.sqlite")

              # Keep the socket bound while Uvicorn starts to avoid a free-port race.
              sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              sock.bind(("127.0.0.1", 0))
              sock.listen(128)
              port = sock.getsockname()[1]

              config = uvicorn.Config("app.main:app", host="127.0.0.1", port=port, log_level="error")
              server = uvicorn.Server(config)
              server_thread = threading.Thread(
                  target=server.run,
                  kwargs={"sockets": [sock]},
                  daemon=True,
              )
              server_thread.start()

              base = f"http://127.0.0.1:{port}"
              ready = None

              try:
                  for _ in range(40):
                      if not server_thread.is_alive():
                          raise RuntimeError("API server exited before becoming ready")
                      try:
                          with urllib.request.urlopen(base + "/api/ready", timeout=2) as response:
                              ready = json.load(response)
                          break
                      except Exception:
                          time.sleep(0.25)
                  else:
                      raise RuntimeError("API server did not become ready")

                  assert ready["status"] == "ready"

                  with urllib.request.urlopen(base + "/api/health", timeout=3) as response:
                      health = json.load(response)
                  assert health["mode"] == "research-only"
                  assert health["paper_trading"] is False
                  assert health["broker_execution"] is False

                  with urllib.request.urlopen(base + "/api/providers/status", timeout=3) as response:
                      providers = json.load(response)
                  assert providers["status"] == "no_live_provider_configured"

                  with urllib.request.urlopen(base + "/api/market-data/sample?symbol=BTCUSD&interval=1d&limit=3", timeout=3) as response:
                      sample = json.load(response)
                  assert sample["status"] == "synthetic"
                  assert len(sample["bars"]) == 3

                  print("API runtime smoke test passed: readiness, health, provider status, synthetic fixture")
              finally:
                  server.should_exit = True
                  server_thread.join(timeout=5)
                  if server_thread.is_alive():
                      server.force_exit = True
                      server_thread.join(timeout=5)
                  sock.close()
          PY

      - name: Workflow node smoke test
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from app.workflow import execute_workflow

          nodes = [
              {"id": "input", "type": "market_input", "data": {"values": [100, 101, 103, 102]}},
              {"id": "quality", "type": "data_quality", "data": {}},
              {"id": "returns", "type": "returns", "data": {}},
          ]
          edges = [
              {"source": "input", "target": "quality"},
              {"source": "quality", "target": "returns"},
          ]
          result = execute_workflow(nodes, edges, {})
          assert result["status"] == "completed"
          assert result["results"]["quality"]["quality"]["status"] == "pass"
          print("Workflow node smoke test passed")
          PY

      - name: Capture backend failure diagnostics
        if: failure()
        env:
          PYTHONPATH: backend
        run: |
          python -m pip freeze > backend-pip-freeze.txt 2>&1 || true
          python -m unittest discover -s backend/tests -v > backend-test-retry.log 2>&1 || true

      - name: Upload backend diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            backend-pip-freeze.txt
            backend-test-retry.log
          if-no-files-found: warn

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install, test and build frontend
        working-directory: frontend
        run: |
          npm install
          npm test
          npm run build

      - name: Capture frontend failure diagnostics
        if: failure()
        working-directory: frontend
        run: |
          npm ls --all > frontend-dependency-tree.txt 2>&1 || true
          npm audit --json > frontend-npm-audit.json 2>&1 || true

      - name: Upload frontend diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-diagnostics
          path: |
            frontend/frontend-dependency-tree.txt
            frontend/frontend-npm-audit.json
          if-no-files-found: warn

  container-smoke:
    name: Docker Compose integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start private stack
        run: docker compose up --build -d

      - name: Verify API and frontend through loopback proxy
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/api/ready >/tmp/api-ready.json; then
              break
            fi
            sleep 2
          done
          python -c "import json; assert json.load(open('/tmp/api-ready.json'))['status'] == 'ready'"
          curl --fail --silent http://127.0.0.1:8080/ | grep -q 'MARKET-MIND-AI Terminal'
          python - <<'PY'
          import json
          import subprocess

          backend = subprocess.check_output(
              ["docker", "compose", "ps", "-q", "backend"], text=True
          ).strip()
          bindings = json.loads(subprocess.check_output([
              "docker", "inspect", backend, "--format",
              "{{json .HostConfig.PortBindings}}",
          ], text=True))
          assert not any(bindings.values()), f"Backend unexpectedly publishes host ports: {bindings}"
          PY
          echo "Compose integration smoke test passed"

      - name: Show container diagnostics on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=200 || true

      - name: Stop stack
        if: always()
        run: docker compose down -v || true

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Audit backend Python dependencies
        run: pip-audit -r backend/requirements.txt --progress-spinner off

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          npm install --ignore-scripts
          npm audit --audit-level=high

      - name: Capture dependency audit diagnostics
        if: failure()
        run: |
          pip-audit -r backend/requirements.txt --progress-spinner off --format json > backend-pip-audit.json 2>&1 || true
          cd frontend
          npm audit --json > frontend-npm-audit.json 2>&1 || true

      - name: Upload dependency audit diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-diagnostics
          path: |
            backend-pip-audit.json
            frontend/frontend-npm-audit.json
          if-no-files-found: warn

  browser-e2e:
    name: Browser authentication E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: backend
      MARKET_MIND_AUTH_REQUIRED: "true"
      MARKET_MIND_AUTH_DB: ${{ runner.temp }}/auth-e2e.sqlite
      MARKET_MIND_DB: ${{ runner.temp }}/market-e2e.sqlite
      MARKET_MIND_COOKIE_SECURE: "false"
      FRONTEND_ORIGINS: "http://127.0.0.1:5173"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install application and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          cd frontend
          npm install
          npx playwright install --with-deps chromium

      - name: Create ephemeral CI-only owner password hash
        env:
          PYTHONPATH: backend
        run: |
          owner_hash="$(python -c "from app.auth_crypto import hash_password; print(hash_password('e2e-only-test-password-2026'))")"
          echo "MARKET_MIND_OWNER_PASSWORD_HASH=$owner_hash" >> "$GITHUB_ENV"

      - name: Start services, run browser tests, and stop services
        run: |
          set -euo pipefail
          api_log="$RUNNER_TEMP/browser-e2e-api.log"
          frontend_log="$RUNNER_TEMP/browser-e2e-frontend.log"

          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$api_log" 2>&1 < /dev/null &
          api_pid=$!
          nohup bash -c 'cd frontend && VITE_API_URL=http://127.0.0.1:8000 npm run dev -- --host 127.0.0.1' > "$frontend_log" 2>&1 < /dev/null &
          frontend_pid=$!

          cleanup() {
            kill "$frontend_pid" "$api_pid" 2>/dev/null || true
            wait "$frontend_pid" "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/api/ready >/dev/null; then
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "API process exited before readiness"
              cat "$api_log"
              exit 1
            fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:8000/api/ready >/dev/null; then
            echo "API did not become ready within 40 seconds"
            cat "$api_log"
            exit 1
          fi

          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              break
            fi
            if ! kill -0 "$frontend_pid" 2>/dev/null; then
              echo "Frontend process exited before readiness"
              cat "$frontend_log"
              exit 1
            fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
            echo "Frontend did not become ready within 40 seconds"
            cat "$frontend_log"
            exit 1
          fi

          cd frontend
          npm run test:e2e

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-auth-e2e-diagnostics
          path: |
            ${{ runner.temp }}/browser-e2e-api.log
            ${{ runner.temp }}/browser-e2e-frontend.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn

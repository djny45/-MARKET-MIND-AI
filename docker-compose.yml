services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - market_mind_data:/data
    environment:
      - MARKET_MIND_DB=/data/market_mind.db
  web:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - ./frontend:/workspace
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  market_mind_data:
